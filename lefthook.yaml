fmt:
  parallel: false
  jobs:
    - run: oxlint "src/**/*.{jsx,ts,tsx}" --type-aware --fix --ignore-path .gitignore || true
    - run: pnpm oxfmt {staged_files} --fix --ignore-path .gitignore || true

pre-commit:
  parallel: true
  jobs:
    - run: pnpm oxlint {staged_files} --type-aware --fix --ignore-path .gitignore --deny-warnings --max-warnings 0 --report-unused-disable-directives
      glob: "**/*.{jsx,ts,tsx}"
      stage_fixed: true

    - run: pnpm oxfmt {staged_files} --fix --ignore-path .gitignore
      glob: "**/*.{jsx,ts,tsx,json}"
      stage_fixed: true